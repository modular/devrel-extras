[project]
name = "forge"
version = "0.1.0"
description = "Forge — minimal parallel comparison of 3D build results from frontier models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "httpx2>=0.1.0",
]

[project.scripts]
forge = "forge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"templates" = "templates"
"static" = "static"
"vendor" = "vendor"

[tool.uv]
package = true
